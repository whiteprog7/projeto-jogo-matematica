<!doctype html><html lang="pt-BR" data-tufi-practice="v2"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tufi · Treino offline</title><style>body{font:18px/1.6 'Trebuchet MS',Arial,sans-serif;color:#edf5fb;background:#061b30;margin:0;padding:5vw}main{max-width:850px;margin:auto}h1{font-size:2.4rem;line-height:1.1}h2{font-size:1.8rem}p{color:#b4c7d6}a{color:#f0c559}button,select{font:inherit;padding:16px;border:1px solid #547187;border-radius:9px;background:#193b55;color:white;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f0b418;outline-offset:4px}button:disabled{opacity:.6}#options{display:grid;grid-template-columns:1fr 1fr;gap:15px}#message{margin:25px 0;padding:20px;background:#113b46;border-radius:10px}#next{background:#f0b418;color:#001830}small{color:#b4c7d6}select{max-width:100%}.hide{display:none}footer{margin-top:40px}#stored{font-size:1rem}@media(max-width:500px){#options{grid-template-columns:1fr}h1{font-size:2rem}}</style></head><body><main><a href="https://tufi-enigma-numeros.oryon244.chatgpt.site">← Voltar à aventura</a><p>TUFI · TREINO NESTE APARELHO</p><h1>Aprender não precisa esperar.</h1><p>Treine sem internet. Seus resultados ficam neste navegador, separados do ranking e do progresso oficial.</p><label for="region">Escolha uma região</label><p><select id="region"></select> <button id="start">Começar treino</button></p><section id="game" class="hide"><small id="step"></small><h2 id="question" tabindex="-1"></h2><div id="options"></div><div id="message" role="status" class="hide"></div><button id="next" class="hide">Próximo desafio</button></section><p id="stored"></p><p><button id="download">Baixar treino</button></p><footer><small id="cache">Preparando a disponibilidade offline…</small></footer></main><script>const regions = [
    { name: 'Reino dos Números', topic: 'Números naturais', symbol: '＋', color: '#f0b418', guardian: 'Guardião do Portal', lesson: 'Resolva primeiro multiplicações e divisões. Depois, adições e subtrações.', quest: 'Acenda os cinco cristais para abrir o portal do reino.' },
    { name: 'Floresta das Frações', topic: 'Frações e equivalências', symbol: '½', color: '#77d9aa', guardian: 'Guardião das Pontes', lesson: 'Frações equivalentes representam a mesma quantidade. Multiplique numerador e denominador pelo mesmo número.', quest: 'Reconstrua as pontes e devolva a energia à floresta.' },
    { name: 'Montanhas da Geometria', topic: 'Formas e medidas', symbol: '△', color: '#9cbcfb', guardian: 'Guardião dos Cristais', lesson: 'Perímetro é a soma dos lados. A área de um retângulo é base × altura.', quest: 'Alinhe os cristais geométricos para alcançar o cume.' },
    { name: 'Templo das Operações', topic: 'Expressões numéricas', symbol: '×', color: '#eab985', guardian: 'Guardião do Templo', lesson: 'A ordem importa: parênteses primeiro, depois multiplicação e divisão, depois adição e subtração.', quest: 'Ative os mecanismos antigos do templo.' },
    { name: 'Cavernas dos Desafios', topic: 'Decimais e grandezas', symbol: '÷', color: '#b1a8f4', guardian: 'Guardião das Medidas', lesson: 'Um metro tem 100 centímetros. Ao somar decimais, alinhe as vírgulas.', quest: 'Ilumine a caverna usando medidas e raciocínio.' },
    { name: 'Fortaleza dos Enigmas', topic: 'Revisão e raciocínio', symbol: '∞', color: '#efce6d', guardian: 'Guardião do Conhecimento', lesson: 'Leia o problema, escolha a operação e confira se o resultado faz sentido.', quest: 'Reúna tudo o que aprendeu e liberte a energia do conhecimento.' }
];
const gears = [{ name: 'Pulseira numérica', symbol: '＋', xp: 0, level: 'Aprendiz' }, { name: 'Mochila do explorador', symbol: '÷', xp: 400, level: 'Explorador' }, { name: 'Compasso do estrategista', symbol: '△', xp: 1200, level: 'Estrategista' }, { name: 'Insígnia do conhecimento', symbol: '∞', xp: 2400, level: 'Capitão' }];
function rand(n) { const v = new Uint32Array(1); if(globalThis.crypto?.getRandomValues)globalThis.crypto.getRandomValues(v);else v[0]=Math.floor(Math.random()*4294967296); return v[0] % n; }
function makeQuestion(region, stage) {
    const a = rand(8) + 3, b = rand(6) + 2;
    let text = '', answer = '', explanation = '', wrong = [];
    const number = (t, n, e) => { text = t; answer = String(n); explanation = e; wrong = [String(n + 1), String(n + 3), String(Math.max(0, n - 2))]; };
    if (region === 0) {
        if (stage < 2)
            number(`${a * 10} + ${b * 3} = ?`, a * 10 + b * 3, `Some as dezenas e as unidades: ${a * 10} + ${b * 3} = ${a * 10 + b * 3}.`);
        else if (stage < 4)
            number(`Há ${a} caixas com ${b} cristais em cada uma. Quantos cristais há?`, a * b, `${a} grupos de ${b}: ${a} × ${b} = ${a * b}.`);
        else
            number(`O portal precisa de ${a * b} cristais. Já tem ${a}. Quantos faltam?`, a * b - a, `Subtraia o que já existe: ${a * b} − ${a} = ${a * b - a}.`);
    }
    if (region === 1) {
        if (stage % 2 === 0) {
            text = `Qual fração equivale a 1/${b}?`;
            answer = `${a}/${a * b}`;
            wrong = [`${a}/${a * b + 1}`, `1/${b + 1}`, `${a + 1}/${a * b}`];
            explanation = `Multiplique as duas partes por ${a}: 1/${b} = ${a}/${a * b}.`;
        }
        else
            number(`Quanto é 1/${b} de ${a * b}?`, a, `Divida o total em ${b} partes iguais: ${a * b} ÷ ${b} = ${a}.`);
    }
    if (region === 2) {
        if (stage === 0) {
            text = 'Quantos lados tem um hexágono?';
            answer = '6';
            wrong = ['5', '7', '8'];
            explanation = 'O hexágono é um polígono de seis lados.';
        }
        else if (stage === 3) {
            text = 'Quanto mede um ângulo reto?';
            answer = '90°';
            wrong = ['45°', '180°', '360°'];
            explanation = 'Um ângulo reto mede 90°, como o canto de um quadrado.';
        }
        else if (stage % 2)
            number(`Um retângulo mede ${a} m por ${b} m. Qual é o perímetro, em metros?`, 2 * (a + b), `Some os quatro lados: ${a} + ${b} + ${a} + ${b} = ${2 * (a + b)} m.`);
        else
            number(`Um retângulo mede ${a} m por ${b} m. Qual é a área, em m²?`, a * b, `Área = base × altura = ${a} × ${b} = ${a * b} m².`);
    }
    if (region === 3) {
        if (stage % 2)
            number(`(${a} + ${b}) × 2 = ?`, (a + b) * 2, `Parênteses primeiro: ${a + b} × 2 = ${(a + b) * 2}.`);
        else
            number(`${a} + ${b} × 2 = ?`, a + b * 2, `Multiplique antes de somar: ${a} + ${b * 2} = ${a + b * 2}.`);
    }
    if (region === 4) {
        if (stage % 2)
            number(`${a} metros equivalem a quantos centímetros?`, a * 100, `Cada metro tem 100 cm: ${a} × 100 = ${a * 100} cm.`);
        else {
            text = `${a},50 + ${b},25 = ?`;
            answer = `${a + b},75`;
            wrong = [`${a + b},25`, `${a + b + 1},75`, `${a + b},50`];
            explanation = `Some as partes inteiras e os centésimos: ${a + b} + 0,75 = ${answer}.`;
        }
    }
    if (region === 5) {
        if (stage < 2)
            number(`Divida ${a * b} cristais igualmente entre ${b} portais. Quantos vão em cada um?`, a, `${a * b} ÷ ${b} = ${a}.`);
        else if (stage < 4)
            number(`Uma sequência começa em ${a} e aumenta de ${b} em ${b}: ${a}, ${a + b}, ${a + 2 * b}, ... Qual é o próximo número?`, a + 3 * b, `Adicione ${b} ao último número: ${a + 2 * b} + ${b} = ${a + 3 * b}.`);
        else
            number(`Uma sala tem ${a} fileiras com ${b} lugares. ${b} lugares estão vazios. Quantas pessoas estão sentadas?`, a * b - b, `Primeiro calcule os lugares: ${a} × ${b} = ${a * b}. Depois subtraia os vazios: ${a * b} − ${b} = ${a * b - b}.`);
    }
    const options = [answer, ...wrong];
    for (let i = options.length - 1; i > 0; i--) {
        let j = rand(i + 1);
        [options[i], options[j]] = [options[j], options[i]];
    }
    return { text, options, correct: options.indexOf(answer), explanation };
}
function publicQuestion(q) { return { text: q.text, options: q.options }; }
function scoreRun(correct) { return correct * 100; }

(function(){
const $=s=>document.querySelector(s);let step=0,correct=0,region=0,question,answered=false,finished=false;
regions.forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=r.name;$('#region').append(o)});
function show(){answered=false;question=makeQuestion(region,step);$('#step').textContent=`Desafio ${step+1} de 5`;$('#question').textContent=question.text;$('#options').replaceChildren();$('#message').classList.add('hide');$('#next').classList.add('hide');question.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(answered||finished)return;answered=true;const ok=i===question.correct;if(ok)correct++;$('#options').querySelectorAll('button').forEach(el=>el.disabled=true);$('#message').textContent=(ok?'Muito bem! ':'Errar faz parte do aprendizado. ')+question.explanation;$('#message').classList.remove('hide');$('#next').textContent=step===4?'Concluir treino':'Próximo desafio';$('#next').classList.remove('hide')};$('#options').append(b)});$('#question').focus()}
$('#start').onclick=()=>{region=Number($('#region').value);step=0;correct=0;finished=false;$('#game').classList.remove('hide');show()};
function readHistory(){try{const a=JSON.parse(localStorage.getItem('tufi-offline-history')||'[]');return Array.isArray(a)?a.filter(x=>x&&Number.isInteger(x.region)&&regions[x.region]&&Number.isInteger(x.correct)&&x.correct>=0&&x.correct<=5).slice(-100):[]}catch{return []}}
function saved(){const a=readHistory(),last=a[a.length-1];$('#stored').textContent=last?`${a.length} treinos guardados neste navegador. Último: ${last.correct}/5 acertos em ${regions[last.region].name}.`:''}
$('#next').onclick=()=>{if(!answered||finished)return;if(step<4){step++;show();return}finished=true;$('#question').textContent=`Treino concluído: ${correct}/5 acertos!`;$('#options').replaceChildren();$('#message').textContent='Continue praticando. Este resultado não será enviado ao ranking.';$('#next').classList.add('hide');try{const a=readHistory();a.push({region,correct,date:Date.now()});localStorage.setItem('tufi-offline-history',JSON.stringify(a.slice(-100)));saved()}catch{$('#stored').textContent='O treino terminou, mas este navegador não permitiu guardar o resultado.'}};saved();
$('#download').onclick=()=>{const clean=document.documentElement.cloneNode(true);clean.querySelector('#region').replaceChildren();clean.querySelector('#options').replaceChildren();clean.querySelector('#game').classList.add('hide');clean.querySelector('#stored').textContent='';clean.querySelector('#question').textContent='';clean.querySelector('#message').textContent='';const blob=new Blob(['<!doctype html>\n'+clean.outerHTML],{type:'text/html;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='Tufi-Treino-Offline.html';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};
const timeout=(promise,ms)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))]);
async function prepare(){
 if(location.protocol==='file:'){$('#cache').textContent='Arquivo offline: você pode jogar sem conexão. Guarde este arquivo no aparelho.';return}
 if(!('serviceWorker'in navigator)||!('caches'in window)){$('#cache').textContent='O navegador não permite preparar o modo offline. Use “Baixar treino” e abra o arquivo no aparelho.';return}
 try{const registration=await timeout(navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}),10000);await registration.update().catch(()=>{});await timeout(navigator.serviceWorker.ready,10000);
 const response=await timeout(fetch('/api/practice',{cache:'no-store',credentials:'same-origin'}),10000);if(!response.ok||response.redirected)throw new Error('response');const html=await response.clone().text();if(!html.includes('data-tufi-practice="v2"'))throw new Error('not-practice');await(await caches.open('tufi-practice-v2')).put('/api/practice',response);$('#cache').textContent='Treino preparado para uso offline neste navegador. Você também pode baixar uma cópia.';
 }catch{$('#cache').textContent='Não foi possível preparar o navegador para uso offline. O treino funciona agora; baixe uma cópia para jogar sem internet.'}}
prepare();
document.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)||e.target.tagName==='SELECT')return;const els=[...document.querySelectorAll('a,button:not(:disabled),select')].filter(x=>x.offsetParent);if(!els.length)return;e.preventDefault();const i=els.indexOf(document.activeElement),d=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;els[(i+d+els.length)%els.length].focus()});
})();
</script></body></html>
